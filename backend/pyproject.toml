[project]
name = "hiddendoor-backend"
version = "0.1.0"
description = "Skrivena vrata API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "django-cors-headers>=4.6",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.8",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
addopts = "-q"
# WhiteNoise warns when collectstatic has not run; irrelevant for API tests.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S105", "S106"]  # fake secrets in tests are fine
