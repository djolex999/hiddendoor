# Local development database only. Not used in production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hiddendoor
      POSTGRES_PASSWORD: hiddendoor
      POSTGRES_DB: hiddendoor
    ports:
      # Host port 5433 because 5432 is often taken by a local Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiddendoor -d hiddendoor"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
